services:
  postgres:
    image: postgres:17-alpine
    container_name: stayfinder-postgres
    environment:
      POSTGRES_USER: stayfinder
      POSTGRES_PASSWORD: stayfinder
      POSTGRES_DB: stayfinder
    ports:
      - "5432:5432"
    volumes:
      - stayfinder-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayfinder -d stayfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stayfinder-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stayfinder-pgdata:
