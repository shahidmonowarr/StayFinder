services:
  postgres:
    image: postgres:17-alpine
    container_name: stayfinder-postgres
    environment:
      POSTGRES_USER: stayfinder
      POSTGRES_PASSWORD: stayfinder
      POSTGRES_DB: stayfinder
    ports:
      # Published on 5433, not 5432. A locally installed Postgres holding the
      # default port is common enough that colliding with it by default would
      # make `docker compose up -d` appear to work while every connection went
      # to the wrong database.
      - "5433:5432"
    volumes:
      - stayfinder-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayfinder -d stayfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stayfinder-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stayfinder-pgdata:
